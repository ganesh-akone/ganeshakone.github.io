<style>

</style></head><body>
<div class="w">
<header><h1>Ganesh<br>Akone</h1>
<p class="role" id="role"></p>

</div>
<script>
const $=s=>document.querySelector(s),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const D=[
{k:"Education",e:"🎓",r:"Foundation",c:"#5CC27E",h:"<p><b>B.Pharm, 2026.</b> Central India College of Pharmacy, Nagpur. College topper, merit scholarship.</p><p>ITI Computer Operator 2022: 88%. HSC Science 2020: 83.69%.</p><p>GPAT 2026 score 108. MHT-CET 2022: 94.87 percentile.</p>"},
{k:"Thesis",e:"🧪",r:"Rare",c:"#F2B632",h:"<p>Polyherbal wound-healing cream (O/W emulsion) with banyan, neem and turmeric extracts. Stability, pH and spreadability tested.</p><p>Intern at MOIL Limited, 2022–23: data integrity and documentation.</p>"},
{k:"Design",e:"📜",r:"Legendary",c:"#F08A7E",h:"<p><b>Registered Design No. 471452-001</b>, January 2026. Co-inventor of a device for identifying phytoconstituents from herbs. The Patent Office, Government of India.</p>"},
{k:"Papers",e:"📚",r:"Epic",c:"#7FB0F0",h:"<ul><li>Herbal immunomodulators for Long COVID (IJPS, Nov 2025)</li><li>Smoking and cardiovascular health with herbal treatment (IJRASET, Nov 2025)</li><li>Early-onset Alzheimer’s and herbal management (IJPS, Sep 2025)</li><li>Liquid biopsy for cancer detection (book chapter, Sep 2025)</li></ul>"},
{k:"Skills",e:"⚗️",r:"Rare",c:"#C9D86B",h:"<p>GMP and PCI compliance, SOPs, validation workflows, quality auditing.</p><p>Polyherbal formulation, phytoconstituent extraction, scientific writing.</p><p>Advanced Excel (data validation, pivot tables), documentation integrity.</p>"},
{k:"Contact",e:"✉️",r:"Quest reward",c:"#C99BE8",h:"<p>Open to R&amp;D and QA/QC roles in pharma. Let’s talk.</p><a class='btn' href='mailto:gakone5@gmail.com'>Email me</a><a class='btn g' href='https://linkedin.com/in/ganesh-akone' rel='noopener'>LinkedIn</a>"}];
const got=new Set();let win=0;
D.forEach((d,i)=>{const a=document.createElement("article");a.className="card";a.id="c"+i;a.style.setProperty("--c",d.c);
a.innerHTML="<div class='ic'>"+d.e+"</div><span class='rr'>"+d.r+"</span><h3></h3><div class='l'><p>Locked. Pop its orb to open.</p></div><div class='b'>"+d.h+"</div>";a.querySelector("h3").textContent=d.k;$("#cards").append(a)});
function unlock(i){if(got.has(i))return;got.add(i);const c=$("#c"+i);c.classList.add("on");
$("#cnt").textContent=got.size+"/6";$("#xp").style.width=got.size/6*100+"%";
if(got.size==6){win=performance.now();$("#hint").textContent="Level complete. Scroll down and say hello.";confetti()}else $("#hint").textContent=D[i].k+" unlocked. "+(6-got.size)+" to go.";
c.scrollIntoView({block:"nearest",behavior:RM?"auto":"smooth"})}
$("#sk").onclick=()=>{D.forEach((_,i)=>{unlock(i);O[i]&&(O[i].alive=false)});$("#cards").scrollIntoView({behavior:RM?"auto":"smooth"})};
/* typewriter */
const R=["Formulation scientist","Registered-design co-inventor","Published author","QA/QC minded"];let ri=0,ci=0,del=0;
function ty(){const t=R[ri];ci+=del?-1:1;$("#role").textContent=t.slice(0,ci);let w=del?35:70;
if(!del&&ci==t.length){del=1;w=1400}else if(del&&ci==0){del=0;ri=(ri+1)%R.length;w=300}setTimeout(ty,w)}
RM?$("#role").textContent=R[0]:ty();
/* game */
const cv=$("#gm"),cx=cv.getContext("2d"),F=[],T=[];let W,H;
const O=D.map((d,i)=>({i,d,hx:0,hy:0,r:40,ph:i*1.3,alive:true,px:0,py:0}));
function rs(){const dp=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dp;cv.height=H*dp;cx.setTransform(dp,0,0,dp,0,0);
O.forEach((o,i)=>{o.hx=(i%3+.5)*W/3;o.hy=H*(i<3?.28:.7)})}
rs();addEventListener("resize",rs);
function burst(x,y,c,n,sp){for(let k=0;k<n;k++){const a=Math.random()*6.28,s=(.4+Math.random())*sp;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:1,c,g:0})}}
function confetti(){const cs=["#5CC27E","#F2B632","#F08A7E","#7FB0F0","#C99BE8"];for(let k=0;k<110;k++)F.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*3,vy:1+Math.random()*3,t:2,c:cs[k%5],g:.06,sq:1})}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
for(const o of O){if(o.alive&&Math.hypot(o.px-x,o.py-y)<o.r+12){o.alive=false;unlock(o.i);burst(o.px,o.py,o.d.c,26,5);break}}});
cv.addEventListener("pointermove",e=>{if(RM)return;const r=cv.getBoundingClientRect();T.push({x:e.clientX-r.left,y:e.clientY-r.top,t:1});if(T.length>40)T.shift()});
function loop(t){cx.clearRect(0,0,W,H);
for(const o of O){if(!o.alive)continue;const k=RM?0:1;o.px=o.hx+Math.sin(t/1100+o.ph)*26*k;o.py=o.hy+Math.cos(t/1400+o.ph)*20*k;
const g=cx.createRadialGradient(o.px-12,o.py-14,4,o.px,o.py,o.r);g.addColorStop(0,"#fff");g.addColorStop(.25,o.d.c);g.addColorStop(1,"rgba(0,0,0,.55)");
cx.save();cx.shadowColor=o.d.c;cx.shadowBlur=26;cx.fillStyle=g;cx.beginPath();cx.arc(o.px,o.py,o.r,0,7);cx.fill();cx.restore();
cx.font="30px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(o.d.e,o.px,o.py-2);
cx.font="800 12px Work Sans,sans-serif";cx.fillStyle="#fff";cx.shadowColor="#000";cx.shadowBlur=4;cx.fillText(o.d.k,o.px,o.py+o.r+14);cx.shadowBlur=0}
for(let i=T.length-1;i>=0;i--){const p=T[i];p.t-=.05;if(p.t<=0){T.splice(i,1);continue}cx.globalAlpha=p.t*.7;cx.fillStyle="#F2B632";cx.beginPath();cx.arc(p.x,p.y,4*p.t,0,7);cx.fill()}
for(let i=F.length-1;i>=0;i--){const f=F[i];f.x+=f.vx;f.y+=f.vy;f.vy+=f.g;f.t-=f.sq?.006:.025;if(f.t<=0||f.y>H+10){F.splice(i,1);continue}
cx.globalAlpha=Math.min(1,f.t);cx.fillStyle=f.c;f.sq?cx.fillRect(f.x,f.y,7,4):(cx.beginPath(),cx.arc(f.x,f.y,4,0,7),cx.fill())}
cx.globalAlpha=1;
if(win){const s=Math.min(1,(t-win)/600);cx.save();cx.translate(W/2,H/2);cx.scale(.4+.6*s,.4+.6*s);cx.globalAlpha=s;cx.shadowColor="#F2B632";cx.shadowBlur=24;
cx.fillStyle="#F2B632";cx.font="800 34px Fraunces,Georgia,serif";cx.textAlign="center";cx.fillText("Level complete",0,0);cx.restore()}
requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
